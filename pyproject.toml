[project]
name = "agent-ix-core-data"
dynamic = ["version"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[tool.poetry]
name = "agent-ix-core-data"
version = "0.1.0"  # Placeholder, dynamically replaced
description = "Shared Avro-generated core data contract for Filament IDE, core service, parser, and sync packages."
authors = ["Agent IX <engineering@agent-ix.com>"]
packages = [{ include = "agent_ix_core_data" }]
include = [
    { path = "schema/avro/core-data.avpr", format = ["sdist", "wheel"] },
    { path = "fixtures/representative-core-payloads.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

[tool.poetry.group.python-backend.dependencies]
# Issue #23 (FR-072). Exact pins: the qualification's verdicts are only meaningful
# against the versions that produced them, and the generator's advisory floor is
# a version comparison, not a range. The `http` and `httpx2` extras are
# deliberately absent so remote reference fetching has no transport at all.
datamodel-code-generator = "0.76.0"
pydantic = "2.12.5"
msgspec = "0.21.1"
mypy = "1.19.1"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
poethepoet = "^0.41.0"
poetry-dynamic-versioning = "^1.10.0"
pytest = "^9.0.2"
ruff = "^0.14.13"
jsonschema = "^4.26.0"

[tool.poetry.scripts]
build-tools = "scripts.build_tools:main"

[tool.poe.tasks]

[tool.poe.tasks.version]
cmd = "build-tools version"
help = "Print computed version"

[tool.poe.tasks.info]
cmd = "build-tools info"
help = "Show git and version info"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "TID"]
ignore = ["E203"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.poetry-dynamic-versioning]
enable = true
style = "pep440"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

# Issue #23 (FR-080). Strict, scoped to the generated tree and the examples, with
# no per-module override and no relaxation: a type the checker rejects is a
# qualification finding, and the permitted remedies do not include silencing it.
[tool.mypy]
python_version = "3.13"
strict = true
files = ["python_backend"]
mypy_path = ["python_backend/generated"]
