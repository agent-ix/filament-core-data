[project]
name = "agent-ix-core-data"
dynamic = ["version"]

[tool.poetry]
name = "agent-ix-core-data"
version = "0.1.0"
description = "Shared Avro-generated core data contract for Filament IDE, core service, parser, and sync packages."
authors = ["Agent IX <engineering@agent-ix.com>"]
packages = [{ include = "agent_ix_core_data" }]
include = [
    { path = "schema/avro/core-data.avpr", format = ["sdist", "wheel"] },
    { path = "fixtures/representative-core-payloads.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
pytest = "^9.0.2"
ruff = "^0.14.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "TID"]
ignore = ["E203"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
