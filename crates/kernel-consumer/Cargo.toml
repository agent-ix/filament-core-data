# The FR-089 Rust consumer. The harness copies this crate beside the unpacked
# `cargo package --offline --no-verify` artifact, so this sibling path can never
# resolve into the generator working tree.

[package]
name = "kernel-consumer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "AGPL-3.0-only"
publish = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
warnings = "deny"

[dependencies]
agent-ix-semantic-kernel = { path = "../agent-ix-semantic-kernel-0.1.0" }

[dev-dependencies]
serde_json = "=1.0.151"
