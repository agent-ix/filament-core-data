manifest_version: 1.0.0
name: fixture-domain
version: 0.1.0
description: A synthetic domain-modelling module for the extraction frontend's fixtures
semantic:
  contract_version: 1.0.0
  semantic_core: 0.3.0
  package: fixture/domain
  exports:
  - domain
  - entity
  - value_object
  - aggregate_root
  - nested_entity
  - repository
  - event
  - state_machine
  - process
  - enumeration
  - population
  imports: {}
  targets: [json-schema]
  mappings: [typed-table, sysml-fence, generalization, abstract-types, presence, subsetting, redefinition, effect-frames, relationships]
  compatibility_posture: strict
  legacy_forms: warning
edge_types:
  specializes: { description: "The source type specializes the target type and inherits its declarations.", category: structural, inverse: generalizes }
  contains: { description: "The source owns the target's lifecycle.", category: structural, inverse: part_of }
  aggregates: { description: "An aggregate root groups member entities.", category: structural, inverse: part_of }
  composes: { description: "A value object is built from other value objects or enumerations.", category: structural, inverse: composed_by }
  triggers: { description: "Starts a process or action.", category: behavioral }
  transitions_to: { description: "A state machine moves to another state machine.", category: behavioral }
  raises: { description: "A state machine raises a domain event.", category: behavioral }
  reads: { description: "Non-mutating data access.", category: dataflow }
  writes: { description: "Mutating data access.", category: dataflow }
  consumes: { description: "Receives a domain event.", category: dataflow }
  emits: { description: "Produces a domain event.", category: dataflow, inverse: emitted_by }
  carries: { description: "An event carries a payload type.", category: dataflow }
  persists: { description: "A repository persists an aggregate or entity.", category: dependency }
  owns: { description: "An entity owns a state machine.", category: dependency }
  operates_on: { description: "A process manipulates a domain object.", category: realization }
  references: { description: "Loose, untyped linkage.", category: traceability }
roles:
  aggregate-member: { description: "A type an aggregate root may list as a member." }
  composite-owner: { description: "A type that may own a nested entity." }
archetypes: []
grammars: []
artifact_types: []
lint_rules: []
object_types:
- name: domain
  construct:
    identity: none
    shape: namespace
    members: {members: required, vocabulary: required, fields: forbidden, operations: forbidden}
    rules: [no_fields, no_operations, exclusive_membership, members_not_namespace]
    meaning: quire.meaning.model.namespace/v1
  allowed_links:
    contains: [entity, aggregate_root, value_object, repository, event, state_machine, process, enumeration]
  data_schema:
    schema: schemas/Domain.json
  body_extraction:
    yield_pattern:
      match:
        id: &id
          from: frontmatter_field
          path: [id]
          regex: ^([A-Za-z][A-Za-z0-9_]*)$
          required: true
        title: &title
          from: frontmatter_field
          path: [title]
          required: true
        type: &type
          from: frontmatter_field
          path: [type]
          required: true
        bounded_context:
          from: section_body
          after_heading: Bounded Context
          required: true
        vocabulary:
          from: table_row
          under_section: Ubiquitous Language
          required: false
          assert:
            columns: [Term, Description]
            min_rows: 1
- name: entity
  roles: [domain-object, persistable, aggregate-member, composite-owner]
  construct:
    identity: identified
    shape: record
    members: {fields: required, identityFields: required}
    rules: [identity_field_required]
    meaning: quire.meaning.model.object-type/v1
  allowed_links:
    specializes: [entity]
    contains: [nested_entity, value_object]
    owns: [state_machine]
    references: [entity, aggregate_root, enumeration]
  data_schema:
    schema: schemas/Entity.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        properties:
          from: section_body
          after_heading: Properties
          required: true
        relationships:
          from: table_row
          under_section: Relationships
          required: false
          assert:
            columns: [Name, Verb, Target, Multiplicity]
- name: value_object
  roles: [domain-object, aggregate-member]
  construct:
    identity: value
    shape: record
    members: {fields: required}
    rules: [identity_field_forbidden]
    meaning: quire.meaning.model.record-value-type/v1
  allowed_links:
    specializes: [value_object]
    composes: [value_object, enumeration]
    references: [enumeration]
  data_schema:
    schema: schemas/ValueObject.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        properties:
          from: section_body
          after_heading: Properties
          required: true
        fields:
          from: section_body
          after_heading: Fields
          required: false
- name: aggregate_root
  roles: [domain-object, persistable, composite-owner]
  construct:
    identity: identified
    shape: record
    members: {fields: required, identityFields: required, clauses: required, members: required}
    references:
      members: [aggregate-member]
    rules: [identity_field_required, min_clauses]
    meaning: quire.meaning.model.object-type/v1
  allowed_links:
    specializes: [aggregate_root]
    aggregates: [entity, nested_entity]
    contains: [value_object]
    emits: [event]
    references: [aggregate_root, enumeration]
  data_schema:
    schema: schemas/AggregateRoot.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        members:
          from: table_row
          under_section: Members
          required: true
          assert:
            columns: [Member, Multiplicity]
            min_rows: 1
        relationships:
          from: table_row
          under_section: Relationships
          required: false
          assert:
            columns: [Name, Verb, Target, Multiplicity]
- name: nested_entity
  roles: [domain-object, aggregate-member, composite-owner]
  construct:
    identity: identified
    shape: record
    members: {fields: required, identityFields: required, owner: required}
    references:
      owner: [composite-owner]
    rules: [identity_field_required, single_owner]
    meaning: quire.meaning.model.object-type/v1
  allowed_links:
    specializes: [nested_entity]
    contains: [value_object]
    references: [enumeration]
  data_schema:
    schema: schemas/NestedEntity.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        parent:
          from: section_body
          after_heading: Parent
          required: true
- name: repository
  construct:
    identity: none
    shape: interface
    members: {operations: required, persists: required, fields: forbidden}
    references:
      persists: [persistable]
    rules: [no_fields, min_operations]
    meaning: quire.meaning.model.persistence-interface/v1
  allowed_links:
    persists: [aggregate_root, entity]
  data_schema:
    schema: schemas/Repository.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        operations:
          from: section_body
          after_heading: Operations
          required: true
        relationships:
          from: table_row
          under_section: Relationships
          required: false
          assert:
            columns: [Name, Verb, Target, Multiplicity]
- name: event
  roles: [event-like]
  construct:
    identity: none
    shape: record
    members: {fields: required, occurrenceField: required}
    rules: [identity_field_forbidden, occurrence_field_required]
    meaning: quire.meaning.model.event-type/v1
    immutable: true
  allowed_links:
    specializes: [event]
    carries: [value_object, entity]
    references: [aggregate_root, enumeration]
  data_schema:
    schema: schemas/Event.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        schema_json:
          from: code_block
          after_heading: Schema
          required: true
          language: json
- name: state_machine
  construct:
    identity: none
    shape: state_machine
    members: {operations: required, states: required, transitions: required}
    references:
      transitions: [event-like]
    rules: [min_operations]
    meaning: quire.meaning.model.state-machine/v1
  allowed_links:
    specializes: [state_machine]
    transitions_to: [state_machine]
    raises: [event]
    references: [enumeration]
  data_schema:
    schema: schemas/StateMachine.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        operations:
          from: section_body
          after_heading: Operations
          required: false
        states:
          from: table_row
          under_section: States
          required: true
          assert:
            columns: [State, Description]
            min_rows: 1
        transitions:
          from: table_row
          under_section: Transitions
          required: true
          assert:
            columns: [From, To, Trigger, Guard, Emits]
            min_rows: 1
- name: process
  roles: [measurable]
  construct:
    identity: identified
    shape: sequence
    members: {fields: required, identityFields: required, steps: required}
    references:
      steps: [event-like]
    rules: [identity_field_required]
    meaning: quire.meaning.model.process/v1
  allowed_links:
    specializes: [process]
    triggers: [process, action]
    consumes: [event]
    emits: [event]
    reads: [aggregate_root, entity]
    writes: [aggregate_root, entity]
    operates_on: [domain-object]
  data_schema:
    schema: schemas/Process.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        steps:
          from: table_row
          under_section: Workflow
          required: true
          assert:
            columns: [Step, Kind, Consumes, Emits, Description]
            min_rows: 1
        states:
          from: table_row
          under_section: States
          required: false
          assert:
            columns: [State, Description]
            min_rows: 1
        relationships:
          from: table_row
          under_section: Relationships
          required: false
          assert:
            columns: [Name, Verb, Target, Multiplicity]
- name: enumeration
  roles: [aggregate-member]
  construct:
    identity: none
    shape: enumeration
    members: {variants: required, fields: forbidden, relationships: forbidden, operations: forbidden}
    rules: []
    meaning: quire.meaning.model.variant-type/v1
  allowed_links:
    references: [enumeration]
  data_schema:
    schema: schemas/Enumeration.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        values:
          from: table_row
          under_section: Values
          required: true
          assert:
            columns: [Value, Description]
            min_rows: 1
- name: population
  allowed_links:
    references: [entity, aggregate_root, nested_entity, value_object, event, process]
  data_schema:
    schema: schemas/Population.json
  body_extraction:
    yield_pattern:
      match:
        id: *id
        title: *title
        type: *type
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        members:
          from: table_row
          under_section: Members
          required: true
          assert:
            columns: [Type, Extent]
            min_rows: 1
