manifest_version: 1.0.0
name: frobnicates
version: 0.1.0
description: One entity object type whose allowed_links lists frobnicates while no loaded edge_types declares it (FR-094-AC-4)
semantic:
  contract_version: 1.0.0
  semantic_core: 0.1.0
  package: agent-ix/frobnicates
  exports:
  - entity
  imports: {}
  targets: [json-schema]
  mappings: [typed-table]
  compatibility_posture: additive
  legacy_forms: warning
archetypes: []
grammars: []
artifact_types: []
lint_rules: []
object_types:
- name: entity
  roles: [domain-object]
  allowed_links:
    frobnicates: [entity]
    references: [entity]
  data_schema:
    schema: schemas/Entity.json
    digest: sha256:f916aa2887de70ea96edac7e6c32be1af0b3c0f85dd3b2a85987c93d7db0c18c
  body_extraction:
    yield_pattern:
      match:
        id:
          from: frontmatter_field
          path: [id]
          required: true
        title:
          from: frontmatter_field
          path: [title]
          required: true
        type:
          from: frontmatter_field
          path: [type]
          required: true
        properties:
          from: section_body
          after_heading: Properties
          required: true
