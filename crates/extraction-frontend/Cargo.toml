# The spec-bundle extraction frontend (agent-ix/filament-core-data#36).
#
# `rust-version` is the workspace's supported minimum, because cargo enforces
# every member's `rust-version` under `--workspace` (CR-036-1); the compiler
# is whatever `rust-toolchain.toml` selects. Every dependency is an exact pin:
# `quire-rs` by git `rev` because no release tag contains `Registry::load_module_set`
# (quire-rs#411) or `SemanticContext::with_body_extraction`
# (quire-rs#443) or `CompiledArchetype::construct` (quire-rs#445) and
# `Pre:`/`Post:` contract lines (quire-rs#454) or the vendored FR-035 schema that
# validates `immutable` (quire-rs#456) or `CellRole::PartOwner` admitting a
# composite type as a systems `part`'s owner (quire-rs#461, fixed by #462),
# `serde`/`serde_json` through the workspace's own
# exact pins; the rest with `=`. No `jsonschema` is declared: validation and
# canonical bytes come from `agent-ix-semantic-ir` (FR-097).
[package]
name = "agent-ix-extraction-frontend"
version = "0.2.1"
description = "Lifts a quire spec bundle into the Filament semantic IR."
edition = "2021"
rust-version.workspace = true
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "agent_ix_extraction_frontend"
path = "src/lib.rs"

[[bin]]
name = "extraction-frontend"
path = "src/main.rs"

[dependencies]
quire-rs = { git = "https://github.com/agent-ix/quire-rs", rev = "8ab0d509db3a067eafd5c03f657b51eb2aaab7f2" }
agent-ix-semantic-ir = { path = "../semantic-ir" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
clap = { version = "=4.6.6", features = ["derive"] }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
tempfile = "=3.27.0"
proptest = "=1.11.0"

[lints.rust]
unsafe_code = "forbid"
