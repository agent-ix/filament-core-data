# Rust workspace for agent-ix/filament-core-data#21.
#
# Members built here. `crates/semantic-ir` is the independent Rust
# reader FR-059 requires: it declares no dependency at all, so its agreement
# with the issue #20 oracle is evidence rather than a shared implementation.
# `crates/conformance-adapter` is the process the `rust-backend` slot of
# `conformance/adapters/registry.json` starts. `crates/semantic-schema` is
# the de-vendoring producer surface (PLAT-899 follow-on): it embeds
# `schema/semantic/v1/*.schema.json` via `include_str!` so a Rust consumer
# (e.g. quire-rs) can depend on this repository by git tag instead of
# vendoring a copy of the schema.
#
# The two consumer crates are excluded on purpose. FR-061 builds them against
# the *unpacked* crate artifact in a scratch directory, with no path dependency
# reaching back into this tree, so a build that only works in place is a
# failure rather than a convenience.
#
# `publish = false` is on every member and on this manifest, because the issue
# #21 safety gate forbids crate publication until the cross-language
# compatibility and release-readiness gates pass. `crates/semantic-schema`
# needs no crates.io publish anyway: consumers pin it by git tag.

[workspace]
resolver = "2"
members = ["crates/semantic-ir", "crates/conformance-adapter", "crates/extraction-frontend", "crates/semantic-schema"]
exclude = [
	"crates/consumer-compile-time",
	"crates/consumer-runtime",
	"crates/kernel-consumer",
	"packages/semantic-kernel/rust",
	# The FR-090 parity decision emitter is a measurement harness, not a
	# workspace crate: it is excluded so that the root `Cargo.lock` — which
	# NFR-030 does not permit this issue to write — stays byte-unchanged. It
	# carries its own lock file beside its manifest.
	"packages/semantic-kernel/parity/emitters/rust",
]

[workspace.package]
edition = "2021"
rust-version = "1.85.0"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
