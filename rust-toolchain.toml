# The toolchain every Rust gate in this repository runs on.
#
# FR-060 requires the emitted source to be a fixed point of `rustfmt`; pinning
# the channel here is what makes `rustfmt --check` a claim about the emitter
# rather than about whichever formatter happened to be on the path.

[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
