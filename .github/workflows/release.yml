name: Release

# Manual release: runs the full gate then publishes to private GitHub Packages.
# Version comes from package.json (auto-bumped if already published). Mirrors the
# agent-ix/nodejs-actions house pattern.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: agent-ix/nodejs-actions/.github/workflows/release.yml@main
    # npm_registry defaults to https://npm.pkg.github.com (private GitHub Packages).
    secrets:
      NPM_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
