name: CI

# Shared test/lint/audit gate (no publish). Publishing only ever happens from
# schema-release.yml (not "release.yml": issue #6/FR-134 permanently retires
# that exact filename as the old Avro-era release pipeline's path — see
# test/legacy-avro-retirement.test.ts). Mirrors the agent-ix/nodejs-actions
# house pattern otherwise.

on:
  workflow_dispatch:

jobs:
  ci:
    uses: agent-ix/nodejs-actions/.github/workflows/build-test.yml@main
    # npm_registry defaults to https://npm.pkg.github.com (private GitHub Packages).
    secrets:
      NPM_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
