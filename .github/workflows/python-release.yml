name: Python Release

# Manual release of the Python binding (agent-ix-core-data) to internal-pypi.
# The npm binding (@agent-ix/filament-core-data) ships separately from
# release.yml; the two distributions version independently.
#
# Mirrors the agent-ix/python-service-actions house pattern used by
# filament-domain-events and filament-parser-lib. Manual-only by design — no
# push, pull_request, or schedule triggers.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-to-pypi:
    runs-on: ubuntu-latest

    steps:
      - name: Encode key to base64
        id: encode_key
        run: echo "gcp_key_64=$(echo -n '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: agent-ix/python-service-actions/publish-to-pypi@main
        with:
          username: _json_key_base64
          password: ${{ steps.encode_key.outputs.gcp_key_64 }}
          registry_url: https://${{ vars.GCP_REGION }}-python.pkg.dev/${{ vars.GCP_PROJECT_NAME }}/${{ vars.GCP_PYPI }}
