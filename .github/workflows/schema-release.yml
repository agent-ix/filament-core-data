name: Schema Release

# Publishes this repo's npm packages: packages/semantic-core and schema (the
# @agent-ix/semantic-schema payload). build-test.yml already deferred
# publishing to a same-purpose workflow; this is that workflow — named
# schema-release.yml rather than the house convention's plain release.yml
# because issue #6/FR-134 permanently retires that exact filename as the old
# Avro-era release pipeline's path (test/legacy-avro-retirement.test.ts
# asserts it does not exist, by name, and will keep asserting that after this
# repo's Avro history is otherwise forgotten).
#
# Root package.json stays "private": true (correct for this monorepo root —
# see agent-ix/filament-core-data#218's discussion) and is never published.
# The two payloads below version *independently* (they are different
# contracts with different change cadences), which is why this does not call
# agent-ix/nodejs-actions' generic reusable release.yml (publishes root
# package.json — wrong package) or release-monorepo.yml (one linked version
# across every packages/*/apps/* — wrong for two independently-versioned
# contracts). It reuses that shared tooling's actual building blocks
# (setup-npmrc, the version-resolve/publish steps) inline instead of
# inventing new ones.
#
# Registry: GitHub Packages (npm.pkg.github.com), the default build-test.yml
# already wires `NPM_REGISTRY_TOKEN` at (secrets.REGISTRY_TOKEN). This repo is
# NOT part of the 2026-06-19 public-npmjs migration closure (that's
# spec-artifacts-*/spec-objects-*): @agent-ix/semantic-core has only ever
# existed on npm.ix, which is GitHub Packages' local read-through proxy, and
# stays there. `id-token: write` is carried for parity with the shared
# actions but is a no-op for this token-based publish.
#
# Tags are package-prefixed (`<package>-vX.Y.Z`) because the two payloads
# version independently; a bare `vX.Y.Z` tag cannot say which one moved.
#
# `schema/` carries one payload: the JSON Schema documents under
# schema/semantic/v1/. It is published to npm only.
#
# It was briefly also published to internal-pypi as
# `agent-ix-filament-core-schema`, for filament-core-service. That job is gone:
# filament-core-service is not an authoritative source and is not maintained
# here, so the PyPI half published for a consumer this repo does not own — and
# it was what put `twine`, `poetry build` and GCP service-account key handling
# on the release path. See agent-ix/filament-core-data#222 before adding it
# back: the reason to restore it is a named Python consumer, not a symmetry
# argument. (`poetry` still appears in the test and lint jobs below, for an
# unrelated reason — see there.)

# Dispatch only, like every other workflow here. NFR-038-AC-2 is explicit that
# no workflow declares a `push:`, `pull_request:` or `schedule:` trigger, and
# test/rust-ci-lane.test.ts asserts it over the whole directory. This workflow
# shipped with a `push: tags:` trigger and was the only violator, which turned
# that gate red for everything (#226).
#
# A tag therefore does not publish. Tags still mark what was released — they
# are the record, not the trigger — and the version is named here explicitly.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        options:
          - semantic-core
          - semantic-schema
        required: true
      version:
        description: "Version to publish (e.g. 0.3.0)"
        required: true

permissions:
  contents: read
  id-token: write # no-op: this publish is token-based (GitHub Packages), not OIDC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history. This repo's changed-path gates resolve a commit's parent
      # (`git rev-parse <sha>^`) and read blobs out of a historical base, so a
      # shallow checkout does not make them lenient — it makes them throw. Four
      # cases in conformance-corpus.test.ts died on
      # `fatal: ambiguous argument '<sha>^'` the first time this job ran.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      # `make install` runs `poetry install` for the ROOT pyproject.toml —
      # `package-mode = false`, codegen tooling only (datamodel-code-generator,
      # pydantic, msgspec, mypy). It is not the published payload. setup-python
      # provides the interpreter but not Poetry itself, so without this the job
      # dies with exit 127 and skips the publish via `needs`.
      - run: pip install poetry
      - run: make install
      # `setup-npmrc` writes `.npmrc` into the repo root so pnpm can reach
      # npm.ix. The gates that follow read `git status` and a changed-path set,
      # and an untracked credential file in the root is neither permitted nor
      # meant to be there — this repo's own rule is that no `.npmrc` lives in
      # the tree. It has done its job once `make install` has run, so it goes
      # before anything inspects the tree. Nothing after this point installs.
      - name: Drop the credential file before the tree gates read the tree
        run: rm -f .npmrc

      # The Rust gates run `--offline --locked` by policy: `.cargo/config.toml`
      # sets `offline = true` and FR-061-CON-1 forbids contacting a registry to
      # resolve. That policy assumes a warm cache — the extraction suite's
      # `tc_1329_locked_offline_build_succeeds_from_a_warm_cache` says so by
      # name — and a fresh runner has none.
      #
      # This is the one step allowed to reach the network, and it sits
      # deliberately outside the gates: it populates the cache and resolves
      # nothing, because `--locked` refuses to move a lockfile. Every gate after
      # it still runs offline, still against the pinned graph.
      #
      # Each manifest is fetched, not just the root: the crates in
      # `[workspace] exclude` carry their own lock files precisely so they stay
      # out of the root resolve, which also means the root fetch does not cover
      # them. The kernel parity emitter is one of them and failed here with the
      # same offline-resolve error the root fetch had just fixed elsewhere.
      #
      # The three FR-061 consumer crates are excluded from this loop and must
      # stay excluded. They declare a path dependency on
      # `crates/agent-ix-conformance-<version>/`, which does not exist in the
      # tree: FR-061 unpacks the crate artifact into a scratch directory and
      # builds them there, deliberately, so that a build which only works in
      # place is a failure rather than a convenience. Fetching them from the
      # repo root asks cargo to read a manifest the gate has not created yet,
      # and it exits 101. Their registry dependencies are the workspace's own
      # and are already in the cache from the root fetch.
      - name: Warm the cargo cache (the one online step; every gate stays offline)
        shell: bash
        run: |
          set -e
          # In place: manifests that resolve where they sit and track a
          # lockfile. `--locked` populates the cache and resolves nothing.
          for manifest in \
            Cargo.toml \
            packages/semantic-kernel/parity/emitters/rust/Cargo.toml
          do
            CARGO_NET_OFFLINE=false cargo fetch --locked --manifest-path "$manifest"
          done
          # From a scratch copy: crates the gates themselves copy out of the
          # tree before building, and which cannot be fetched where they sit.
          #  - `packages/semantic-kernel/rust` tracks no lockfile, and the
          #    kernel gate compares the directory against a fresh generation —
          #    fetching in place writes a `Cargo.lock` there and fails it.
          #  - `spikes/typespec-feasibility/generated/custom/rust` lies under
          #    the root workspace without being a member, so cargo refuses it in
          #    place ("believes it's in a workspace when it's not"). The test
          #    that builds it copies it out first, for the same reason.
          # Dependencies land in the shared cargo cache; the tree is untouched.
          for dir in \
            packages/semantic-kernel/rust \
            spikes/typespec-feasibility/generated/custom/rust
          do
            scratch="$RUNNER_TEMP/cargo-fetch/$(basename "$dir")-$RANDOM"
            mkdir -p "$(dirname "$scratch")"
            cp -r "$dir" "$scratch"
            locked=""
            if [[ -f "$scratch/Cargo.lock" ]]; then locked="--locked"; fi
            CARGO_NET_OFFLINE=false cargo fetch $locked --manifest-path "$scratch/Cargo.toml"
          done
          rm -rf "$RUNNER_TEMP/cargo-fetch"
          git status --porcelain --untracked-files=all | tee /dev/stderr | (! grep -q .)

      # FR-040 compares the `relationship.category` enum against the categories
      # a real installed module declares, so the assertion is about agreement
      # with the ecosystem rather than with a fixture this repo wrote. It reads
      # `~/.ix/filament/modules/spec-artifacts-iso/manifest.yaml` and throws
      # when it is absent, which is correct — a skipped comparison would be a
      # vacuous pass.
      #
      # The module is installed from its published package rather than copied
      # into this repo. It lands outside the tree, so nothing here tracks it.
      - name: Install the spec-artifacts-iso module FR-040 measures against
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -e
          dest="$HOME/.ix/filament/modules/spec-artifacts-iso"
          mkdir -p "$dest"
          tgz="$(npm pack @agent-ix/spec-artifacts-iso --silent)"
          tar xzf "$tgz" --strip-components=1 -C "$dest"
          rm -f "$tgz"
          test -f "$dest/manifest.yaml"

      - run: make test-node


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - run: pip install poetry
      - run: make install
      - run: make lint-node

  publish-npm:
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          cache: pnpm
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Resolve package, directory and version
        id: resolve
        shell: bash
        run: |
          PKG="${{ inputs.package }}"
          VER="${{ inputs.version }}"
          case "$PKG" in
            semantic-core) DIR="packages/semantic-core" ;;
            semantic-schema) DIR="schema" ;;
            *) echo "::error::unknown or unresolved package '$PKG'"; exit 1 ;;
          esac
          [[ -n "$VER" ]] || { echo "::error::no version given"; exit 1; }
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set package version
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.resolve.outputs.version }}"

      - name: Publish to GitHub Packages
        working-directory: ${{ steps.resolve.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -e
          PACKAGE_ID="$(node -p "require('./package.json').name")@${{ steps.resolve.outputs.version }}"
          if npm view "$PACKAGE_ID" > /dev/null 2>&1; then
            echo "Already published: $PACKAGE_ID"
            exit 0
          fi
          npm publish

      - name: Write summary
        shell: bash
        run: |
          {
            echo "### Published"
            echo "- Package: \`${{ steps.resolve.outputs.package }}\`"
            echo "- Version: \`${{ steps.resolve.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
