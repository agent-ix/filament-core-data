name: Schema Release

# Publishes this repo's npm packages: packages/semantic-core and schema (the
# @agent-ix/semantic-schema payload). build-test.yml already deferred
# publishing to a same-purpose workflow; this is that workflow — named
# schema-release.yml rather than the house convention's plain release.yml
# because issue #6/FR-134 permanently retires that exact filename as the old
# Avro-era release pipeline's path (test/legacy-avro-retirement.test.ts
# asserts it does not exist, by name, and will keep asserting that after this
# repo's Avro history is otherwise forgotten).
#
# Root package.json stays "private": true (correct for this monorepo root —
# see agent-ix/filament-core-data#218's discussion) and is never published.
# The two payloads below version *independently* (they are different
# contracts with different change cadences), which is why this does not call
# agent-ix/nodejs-actions' generic reusable release.yml (publishes root
# package.json — wrong package) or release-monorepo.yml (one linked version
# across every packages/*/apps/* — wrong for two independently-versioned
# contracts). It reuses that shared tooling's actual building blocks
# (setup-npmrc, the version-resolve/publish steps) inline instead of
# inventing new ones.
#
# Registry: GitHub Packages (npm.pkg.github.com), the default build-test.yml
# already wires `NPM_REGISTRY_TOKEN` at (secrets.REGISTRY_TOKEN). This repo is
# NOT part of the 2026-06-19 public-npmjs migration closure (that's
# spec-artifacts-*/spec-objects-*): @agent-ix/semantic-core has only ever
# existed on npm.ix, which is GitHub Packages' local read-through proxy, and
# stays there. `id-token: write` is carried for parity with the shared
# actions but is a no-op for this token-based publish.
#
# Tags are package-prefixed (`<package>-vX.Y.Z`) because the two payloads
# version independently; a bare `vX.Y.Z` tag cannot say which one moved.
#
# A `semantic-schema` tag publishes to *both* registries in one run
# (publish-npm-schema, publish-python-schema): `schema/` carries one payload,
# the JSON Schema documents under schema/semantic/v1/, packaged twice for two
# ecosystems (npm for TypeScript/JS consumers such as quoin; PyPI for Python
# consumers such as filament-core-service). They therefore always publish
# together at the same version, unlike semantic-core which is its own
# independently-versioned contract. The PyPI half uses the same
# GCP-Artifact-Registry-backed internal-pypi every other agent-ix Python
# package publishes to (agent-ix/python-service-actions/publish-to-pypi),
# inlined with an explicit `working-directory: schema` rather than called as
# that reusable composite action, because the action's own steps (including
# its own checkout) never take a subdirectory input — they always build
# whatever poetry project sits at the repo root, which here is
# python_backend's own tooling-only project, not schema/'s.

on:
  push:
    tags:
      - "semantic-core-v*.*.*"
      - "semantic-schema-v*.*.*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        options:
          - semantic-core
          - semantic-schema
        required: true
      version:
        description: "Version to publish (e.g. 0.3.0); defaults to the triggering tag"
        required: false

permissions:
  contents: read
  id-token: write # no-op: this publish is token-based (GitHub Packages), not OIDC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - run: make install
      - run: make test-node

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - run: make install
      - run: make lint-node

  publish-npm:
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          cache: pnpm
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Resolve package, directory and version
        id: resolve
        shell: bash
        run: |
          PKG="${{ inputs.package }}"
          VER="${{ inputs.version }}"
          if [[ -z "$PKG" && "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PKG="${TAG%-v*}"
            VER="${TAG##*-v}"
          fi
          case "$PKG" in
            semantic-core) DIR="packages/semantic-core" ;;
            semantic-schema) DIR="schema" ;;
            *) echo "::error::unknown or unresolved package '$PKG'"; exit 1 ;;
          esac
          [[ -n "$VER" ]] || { echo "::error::no version resolved (pass a tag or the workflow_dispatch version input)"; exit 1; }
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set package version
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.resolve.outputs.version }}"

      - name: Publish to GitHub Packages
        working-directory: ${{ steps.resolve.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -e
          PACKAGE_ID="$(node -p "require('./package.json').name")@${{ steps.resolve.outputs.version }}"
          if npm view "$PACKAGE_ID" > /dev/null 2>&1; then
            echo "Already published: $PACKAGE_ID"
            exit 0
          fi
          npm publish

      - name: Write summary
        shell: bash
        run: |
          {
            echo "### Published"
            echo "- Package: \`${{ steps.resolve.outputs.package }}\`"
            echo "- Version: \`${{ steps.resolve.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The Python half of schema/'s payload (agent-ix-filament-core-schema), to
  # internal-pypi (GCP Artifact Registry) — the same registry every other
  # agent-ix Python package publishes to. No-op for a semantic-core tag or
  # dispatch: `agent-ix-filament-core-schema` and `@agent-ix/semantic-schema`
  # version together (see the header comment), so this job only has anything
  # to do when publish-npm is publishing schema/'s npm half too.
  publish-python-schema:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: inputs.package == 'semantic-schema' || startsWith(github.ref, 'refs/tags/semantic-schema-v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          if [[ -z "$VER" && "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/semantic-schema-v}"
          fi
          [[ -n "$VER" ]] || { echo "::error::no version resolved (pass a tag or the workflow_dispatch version input)"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Install Poetry and Twine
        run: pip install poetry twine

      - name: Encode key to base64
        id: encode_key
        run: echo "gcp_key_64=$(echo -n '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Configure Poetry auth
        working-directory: schema
        env:
          PYPI_USERNAME: _json_key_base64
          PYPI_PASSWORD: ${{ steps.encode_key.outputs.gcp_key_64 }}
        run: poetry config http-basic.internal-pypi "$PYPI_USERNAME" "$PYPI_PASSWORD"

      - name: Build package
        working-directory: schema
        run: |
          poetry version "${{ steps.resolve.outputs.version }}"
          poetry build

      - name: Publish to internal-pypi
        working-directory: schema
        env:
          REGISTRY_URL: https://${{ vars.GCP_REGION }}-python.pkg.dev/${{ vars.GCP_PROJECT_NAME }}/${{ vars.GCP_PYPI }}
          TWINE_USERNAME: _json_key_base64
          TWINE_PASSWORD: ${{ steps.encode_key.outputs.gcp_key_64 }}
        run: |
          set +e
          twine upload --verbose --repository-url "$REGISTRY_URL" dist/* 2>&1 | tee twine_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            if grep -iq "already exists" twine_output.txt || grep -Eiq "409.*conflict" twine_output.txt; then
              echo "Already published: agent-ix-filament-core-schema ${{ steps.resolve.outputs.version }}"
            else
              echo "::error::twine upload failed with exit code $EXIT_CODE"
              exit "$EXIT_CODE"
            fi
          fi

      - name: Write summary
        shell: bash
        run: |
          {
            echo "### Published"
            echo "- Package: \`agent-ix-filament-core-schema\`"
            echo "- Version: \`${{ steps.resolve.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
